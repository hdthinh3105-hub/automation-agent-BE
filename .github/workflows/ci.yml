name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ─── Static analysis: ESLint có plugin prettier, fail ngay khi có warning ───
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: ESLint (max-warnings 0)
        run: npm run lint:ci

  # ─── Type safety: bắt buộc tsc strict pass ───
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck

  # ─── Unit tests (chạy trong CI, thu coverage) ───
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Jest (coverage)
        run: npm run test:ci
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 14

  # ─── Build: Nest API + Worker, và smoke-build Docker images ───
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Build Nest API
        run: npm run build
      - name: Build Nest Worker
        run: npm run build:worker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Smoke-build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: automation-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-build Worker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          tags: automation-agent-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy: chỉ chạy khi CI pass và push lên main (gộp CD vào CI để không deploy code hỏng) ───
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Deploy API+Worker (merged)
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_API" ]; then
            echo "RENDER_DEPLOY_HOOK_API chua cau hinh - skip deploy"
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_API"
          echo "Deploy triggered for $GITHUB_SHA"
