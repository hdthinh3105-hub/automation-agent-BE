name: Deploy to Render (deprecated - gop vao CI)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy API & Worker (manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy API + Worker (merged single service)
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_API" ]; then
            echo "RENDER_DEPLOY_HOOK_API chua cau hinh - skip deploy"
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_API"
          echo "Merged service deployed (API+Worker in one container)."
