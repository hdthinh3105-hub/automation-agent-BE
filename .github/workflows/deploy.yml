name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy API & Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy API
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_API" ]; then
            echo "RENDER_DEPLOY_HOOK_API chua cau hinh - skip deploy API"
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_API"

      - name: Deploy Worker
        env:
          RENDER_DEPLOY_HOOK_WORKER: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_WORKER" ]; then
            echo "RENDER_DEPLOY_HOOK_WORKER chua cau hinh - skip deploy Worker"
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_WORKER"
