name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy API & Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy API + Worker (merged single service)
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_API" ]; then
            echo "RENDER_DEPLOY_HOOK_API chua cau hinh - skip deploy"
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_API"
          echo "Merged service deployed (API+Worker in one container). Xoa service worker cu tren Render dashboard de tiet kiem 750h."
